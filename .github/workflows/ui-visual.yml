name: Bunny Takeover visual QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser screenshot tool
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Check responsive dimensions and screenshot
        run: python scripts/ui_visual_check.py
      - name: Upload actual rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunny-takeover-ui-screenshots
          path: ui-snapshots/*.png
          if-no-files-found: warn
