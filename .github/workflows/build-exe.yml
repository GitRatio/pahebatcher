name: Build executables

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: pahebatcher-windows-x64.exe
            binary: pahebatcher.exe
            icon: --icon src/pahebatcher/gui/assets/icon.ico
          - os: ubuntu-latest
            asset: pahebatcher-linux-x64
            binary: pahebatcher
          - os: macos-latest
            asset: pahebatcher-macos-arm64
            binary: pahebatcher
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[browser,gui]" pyinstaller
      - name: Build
        run: >
          pyinstaller scripts/pyinstaller_entry.py
          --onefile --clean --noconfirm
          --name pahebatcher
          ${{ matrix.icon }}
          --paths src
          --collect-all curl_cffi
          --collect-all Cryptodome
          --collect-all patchright
          --collect-submodules pahebatcher
          --collect-all webview
      - name: Smoke test
        run: ./dist/${{ matrix.binary }} --help
      - name: Rename
        run: mv "dist/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  build-gui:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[browser,gui]" pyinstaller
      - name: Losslessly optimize embedded artwork
        run: python scripts/optimize_png.py src/pahebatcher/gui/assets/bunny.png src/pahebatcher/gui/assets/icon.png
      - name: Check Tk is available
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"
      - name: Build desktop app
        run: >
          pyinstaller scripts/pyinstaller_gui_entry.py
          --onefile --windowed --clean --noconfirm
          --name pahebatcher-gui
          --icon src/pahebatcher/gui/assets/icon.ico
          --add-data "src/pahebatcher/gui/assets;pahebatcher/gui/assets"
          --paths src
          --collect-all curl_cffi
          --collect-all Cryptodome
          --collect-all patchright
          --collect-submodules pahebatcher
          --collect-all webview
      - name: Rename
        run: mv dist/pahebatcher-gui.exe dist/pahebatcher-gui-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: pahebatcher-gui-windows-x64.exe
          path: dist/pahebatcher-gui-windows-x64.exe

  build-gui-unix:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and builder
        run: python -m pip install -e ".[browser,gui]" pyinstaller pytest pytest-asyncio
      - name: Install Qt native webview backend for Linux
        if: matrix.platform == 'linux'
        run: python -m pip install "pywebview[qt]>=6.2,<7"
      - name: Losslessly optimize embedded artwork
        run: python scripts/optimize_png.py src/pahebatcher/gui/assets/bunny.png src/pahebatcher/gui/assets/icon.png
      - name: Verify tkinter and player unit tests
        run: |
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
          python -m pytest -q tests/test_player.py
      - name: Generate macOS application icon
        if: matrix.platform == 'macos'
        run: |
          mkdir -p build/icon.iconset
          for size in 16 32 128 256 512; do
            doubled=$((size * 2))
            sips -z "$size" "$size" src/pahebatcher/gui/assets/bunny.png --out "build/icon.iconset/icon_${size}x${size}.png" >/dev/null
            sips -z "$doubled" "$doubled" src/pahebatcher/gui/assets/bunny.png --out "build/icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns build/icon.iconset -o build/PaheBatcher.icns
      - name: Build macOS / Linux desktop bundle
        run: |
          extras=()
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            extras=(--osx-bundle-identifier com.gitratio.pahebatcher --icon build/PaheBatcher.icns)
          fi
          python -m PyInstaller scripts/pyinstaller_gui_entry.py \
            --onedir --windowed --clean --noconfirm --name PaheBatcher \
            --paths src \
            --add-data "src/pahebatcher/gui/assets:pahebatcher/gui/assets" \
            --collect-all curl_cffi --collect-all Cryptodome \
            --collect-all patchright --collect-submodules pahebatcher \
            --collect-all webview \
            "${extras[@]}"
      - name: Report largest bundled files for future size reduction
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [p for p in Path("dist").rglob("*") if p.is_file()]
          total = sum(p.stat().st_size for p in paths)
          print(f"Uncompressed distribution: {total / 1048576:.1f} MiB")
          for path in sorted(paths, key=lambda p: p.stat().st_size, reverse=True)[:18]:
              print(f"{path.stat().st_size / 1048576:8.1f} MiB  {path}")
          PY
      - name: Package macOS application
        if: matrix.platform == 'macos'
        run: |
          test -f dist/PaheBatcher.app/Contents/Info.plist
          ditto -c -k --sequesterRsrc --keepParent \
            dist/PaheBatcher.app "dist/PaheBatcher-macos-${{ matrix.arch }}.zip"
      - name: Package Linux application with user installer
        if: matrix.platform == 'linux'
        run: |
          test -x dist/PaheBatcher/PaheBatcher
          mkdir -p package
          cp -a dist/PaheBatcher package/PaheBatcher
          cp scripts/install-linux.sh package/install.sh
          cp src/pahebatcher/gui/assets/icon.png package/icon.png
          chmod 755 package/install.sh
          tar -C package -czf "dist/PaheBatcher-linux-${{ matrix.arch }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: PaheBatcher-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/PaheBatcher-${{ matrix.platform }}-${{ matrix.arch }}.*
          if-no-files-found: error

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-gui, build-gui-unix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  preview-release:
    # A stable, sign-in-free download URL for each unsigned platform preview.
    # Only publish after every build and test succeeds on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, build-gui, build-gui-unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Point rolling preview tag to the tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/preview" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/preview" \
              -f sha="$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/preview -f sha="$GITHUB_SHA"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          target_commitish: ${{ github.sha }}
          name: PaheBatcher GitRatio Edition · v3.13.0 Preview (unsigned)
          body: |
            Rolling development preview built automatically from the tested main branch.
            These downloads are NOT digitally signed or macOS notarized.
            For Windows SmartScreen or macOS Gatekeeper warnings, review the source or build locally.
            Test playback and download behavior on your own device before treating it as production ready.
            Source code and attribution: https://github.com/GitRatio/pahebatcher
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/pahebatcher-gui-windows-x64.exe
            dist/PaheBatcher-macos-arm64.zip
            dist/PaheBatcher-macos-x64.zip
            dist/PaheBatcher-linux-x64.tar.gz
